name: Build DocShot.app

on:
  workflow_dispatch:
  push:
    branches: [ci/build-app]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Build (ad-hoc signed, Release)
        run: |
          xcodebuild build \
            -project DocShot.xcodeproj \
            -scheme DocShot \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify and zip
        run: |
          APP=build/Build/Products/Release/DocShot.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" DocShot-macos-adhoc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DocShot-macos-adhoc
          path: DocShot-macos-adhoc.zip
